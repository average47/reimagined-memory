; Raise PHP's upload limits above the WordPress image defaults
; (upload_max_filesize 2M / post_max_size 8M), mounted into the container's
; conf.d from docker-compose.yml. post_max_size must stay >= upload_max_filesize
; or uploads fail silently. NOTE: Multisite also enforces its own cap
; (`fileupload_maxk`, default 1500 KB) — see apps/cms/README.md.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300
